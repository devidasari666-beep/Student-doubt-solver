<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doubt - Student Doubt Solver</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="doubt.css">
</head>
<body>

  <nav>
    <div class="navbar">
      <div class="logo">Student Doubt Solver</div>
      <div class="nav-right">
        <input type="text" placeholder="Search doubts...">
        <button>Search</button>
        <button class="post-btn">+ Post a Doubt</button>
      </div>
    </div>
  </nav>

  <div class="doubt-page">

    <a href="index.html" class="back-link">← Back to all doubts</a>

    <!-- Question section -->
    <div class="question-box">
      <span class="badge-maths">Maths</span>
      <p class="question-title">What is the difference between permutation and combination?</p>
      <p class="question-meta">posted 10 mins ago · 2 answers</p>
    </div>

    <!-- Answers section -->
    <p class="answers-count">💬 2 Answers</p>

   <div id="answers-container"></div>

    <!-- Write answer section -->
    <div class="write-box">
      <p class="write-title">✍️ Write your Answer</p>
      <textarea class="write-textarea" placeholder="Type your answer here..."></textarea>
      <div class="write-actions">
        <button class="submit-btn" onclick="submitanswer()">Submit Answer</button>
      </div>
    </div>

  </div>

</body>
</html>
<script src="doubt-page.js"></script>
